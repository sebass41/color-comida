<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Color Comida</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-5">

    <section id="inicio">

        <div class="text-center">

            <div class="logo mb-4">
                🍔
            </div>

            <h1 class="fw-bold">
                Comida de color...
            </h1>

            <p class="text-secondary mb-5">
                Elegí tu nombre y descubrí qué color le tocó a tu grupo.
            </p>

        </div>

        <div id="listaPersonas">

            <button class="persona">
                😊 Sebastián
            </button>

            <button class="persona">
                😎 Martín
            </button>

            <button class="persona">
                🥳 Lucía
            </button>

            <button class="persona">
                😁 Camila
            </button>

            <button class="persona">
                🤩 Mateo
            </button>

        </div>

        <button
                id="continuar"
                class="btn btn-primary btn-lg w-100 mt-4"
                disabled>

            Continuar

        </button>

    </section>

    <section id="ruleta" class="d-none">

    <div class="text-center">

        <h2 class="fw-bold">

            🎉 Descubriendo tu color...

        </h2>

        <p class="text-secondary">

            La ruleta está girando.

        </p>

    </div>

    <div class="wheel">

        🎡

    </div>

</section>

<section id="resultado" class="d-none">

    <div class="text-center">

        <div id="circuloColor">

        </div>

        <h2 class="mt-4">

            ¡Listo!

        </h2>

        <h1
            id="nombreColor"
            class="display-3 fw-bold">

            VERDE

        </h1>

        <p class="mt-3">

            Tu grupo deberá llevar una comida principalmente de ese color.

        </p>

        <button class="btn btn-success btn-lg mt-4">

            🍕 Perfecto

        </button>

    </div>

</section>

</div>

<script src="js/app.js"></script>

</body>

</html>
